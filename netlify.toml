# Секцію [build] тут навмисно не визначаємо — команда збірки й публічна
# директорія лишаються такими, як налаштовано в Netlify UI, цей файл їх
# не перевизначає.
#
# Заголовки безпеки (Strict-Transport-Security, X-Frame-Options,
# Content-Security-Policy-Report-Only тощо) сюди не виносимо: сторінки
# йдуть через Next.js Server Handler, а не як статика, тож [[headers]]
# їх не зачіпає. Заголовки виставляє сам Next.js — див. headers() у
# next.config.mjs.

# sharp має нативний бінарник (не чистий JS) — явно просимо Netlify не
# затягувати його в бандл функції, а покласти як є з node_modules.
[functions]
  external_node_modules = ["sharp"]

# Файли з public/ віддає статичний шар Netlify, а не Next.js Server
# Handler — headers() із next.config.mjs їх не зачіпає, тільки цей файл.
# Типово Netlify ставить на них `public,max-age=0,must-revalidate`, і це
# ламало Netlify Image CDN: TTL перетворення успадковується від джерела,
# тож /_next/image щоразу віддавав `Cache-Status: fwd=miss` і заново
# стискав картинку (~500 мс до першого байта на кожен показ героя).
# Імена в /assets/ фіксовані й змінюються лише разом із деплоєм — той
# самий рік, що вже стоїть для Vercel у vercel.json.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
